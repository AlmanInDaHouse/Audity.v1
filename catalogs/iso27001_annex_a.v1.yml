version: v1
framework: ISO27001
controls:
  - id: ISO-A.5.1
    title: Policies for information security
    description: Define, approve and review information security policies so governance expectations are current, assigned and communicated.
    tags: [governance, policy]
    level: base
    severity: high
    mapped_controls: [ENS-ORG-1, RGPD-ART5]
    evidence_requirements:
      - manual.policy_document
      - manual.policy_approval_record
    evaluator_key: policy_governance
  - id: ISO-A.5.2
    title: Information security roles and responsibilities
    description: Assign and communicate security responsibilities, segregation of duties and accountable owners for the control system.
    tags: [governance, roles]
    level: base
    severity: high
    mapped_controls: [ENS-ORG-2, RGPD-ART24]
    evidence_requirements:
      - manual.raci_matrix
      - manual.organization_chart
    evaluator_key: governance_roles
  - id: ISO-A.5.3
    title: Segregation of duties
    description: Separate incompatible duties in operations, administration and review activities to reduce fraud and error risk.
    tags: [governance, access]
    level: base
    severity: high
    mapped_controls: [ENS-OP-ACC, RGPD-ART32]
    evidence_requirements:
      - manual.access_matrix
      - manual.change_approval_records
    evaluator_key: segregation_of_duties
  - id: ISO-A.5.7
    title: Threat intelligence
    description: Collect, analyze and distribute threat intelligence relevant to the organization, suppliers and technology stack.
    tags: [threats, monitoring]
    level: advanced
    severity: medium
    mapped_controls: [ENS-OP-MON, RGPD-ART32]
    evidence_requirements:
      - manual.threat_intelligence_process
      - manual.threat_briefing_records
    evaluator_key: threat_intelligence
  - id: ISO-A.5.8
    title: Information security in project management
    description: Embed security requirements, acceptance criteria and risk review checkpoints into project delivery governance.
    tags: [project, secure_delivery]
    level: base
    severity: medium
    mapped_controls: [ENS-OP-PLN, RGPD-ART25]
    evidence_requirements:
      - manual.project_security_checklist
      - manual.project_gate_reviews
    evaluator_key: project_security_governance
  - id: ISO-A.5.9
    title: Inventory of information and other associated assets
    description: Maintain an asset inventory covering systems, repositories, evidence stores and key business data owners.
    tags: [asset_management, inventory]
    level: base
    severity: high
    mapped_controls: [ENS-OP-EXP, RGPD-ART30]
    evidence_requirements:
      - manual.asset_inventory
      - manual.asset_owner_register
    evaluator_key: asset_inventory
  - id: ISO-A.5.10
    title: Acceptable use of information and associated assets
    description: Define acceptable use rules for users, administrators and third parties covering systems, data and evidence handling.
    tags: [awareness, acceptable_use]
    level: base
    severity: medium
    mapped_controls: [ENS-OP-USO, RGPD-ART29]
    evidence_requirements:
      - manual.acceptable_use_policy
      - manual.user_acknowledgements
    evaluator_key: acceptable_use_policy
  - id: ISO-A.5.12
    title: Classification of information
    description: Classify information by sensitivity, legal constraints and business impact to drive handling and retention rules.
    tags: [data_governance, classification]
    level: base
    severity: high
    mapped_controls: [ENS-MP.INFO, RGPD-ART5]
    evidence_requirements:
      - manual.data_classification_policy
      - manual.data_label_examples
    evaluator_key: information_classification
  - id: ISO-A.5.13
    title: Labelling of information
    description: Apply labels or metadata to classified information so users and systems can enforce handling requirements consistently.
    tags: [data_governance, labelling]
    level: base
    severity: medium
    mapped_controls: [ENS-MP.INFO, RGPD-ART32]
    evidence_requirements:
      - manual.labelling_standard
      - manual.sample_labelled_records
    evaluator_key: information_labelling
  - id: ISO-A.5.14
    title: Information transfer
    description: Protect information transfers with approved channels, encryption, recipient validation and transfer logging where needed.
    tags: [data_transfer, encryption]
    level: base
    severity: high
    mapped_controls: [ENS-OP-COM, RGPD-ART32]
    evidence_requirements:
      - manual.transfer_procedure
      - manual.encryption_standard
    evaluator_key: secure_information_transfer
  - id: ISO-A.5.15
    title: Access control
    description: Establish access control policy, provisioning rules and periodic review for systems, evidence repositories and reports.
    tags: [iam, access]
    level: base
    severity: high
    mapped_controls: [ENS-OP-ACC, RGPD-ART32]
    evidence_requirements:
      - manual.access_control_policy
      - google.users_groups
    evaluator_key: access_control_governance
  - id: ISO-A.5.16
    title: Identity management
    description: Govern lifecycle of identities, joiner-mover-leaver workflows and trusted identity sources across critical systems.
    tags: [iam, lifecycle]
    level: base
    severity: high
    mapped_controls: [ENS-OP-ACC, RGPD-ART24]
    evidence_requirements:
      - google.users_groups
      - manual.joiner_mover_leaver_procedure
    evaluator_key: identity_lifecycle
  - id: ISO-A.5.17
    title: Authentication information
    description: Protect passwords, API tokens and authentication secrets with approved issuance, storage, rotation and revocation controls.
    tags: [iam, secrets]
    level: base
    severity: high
    mapped_controls: [ENS-OP-ACC, RGPD-ART32]
    evidence_requirements:
      - manual.secret_management_standard
      - manual.password_policy
    evaluator_key: authentication_secret_management
  - id: ISO-A.5.18
    title: Access rights
    description: Provision access rights on least privilege, approve privileged changes and review entitlements on a defined cadence.
    tags: [iam, privileged_access]
    level: base
    severity: high
    mapped_controls: [ENS-OP-ACC, RGPD-ART32]
    evidence_requirements:
      - google.users_groups
      - manual.access_review_records
    evaluator_key: access_rights_review
  - id: ISO-A.5.19
    title: Information security in supplier relationships
    description: Assess suppliers, define security clauses and track remediation or exceptions for outsourced or integrated services.
    tags: [third_party, supplier]
    level: base
    severity: high
    mapped_controls: [ENS-EXT, RGPD-ART28]
    evidence_requirements:
      - manual.vendor_due_diligence
      - manual.supplier_security_clauses
    evaluator_key: supplier_security_governance
  - id: ISO-A.5.20
    title: Addressing information security within supplier agreements
    description: Include measurable security commitments, incident notice, audit rights and data handling obligations in supplier contracts.
    tags: [third_party, legal]
    level: base
    severity: high
    mapped_controls: [ENS-EXT, RGPD-ART28]
    evidence_requirements:
      - manual.signed_supplier_agreements
      - manual.dpa_records
    evaluator_key: supplier_agreements
  - id: ISO-A.5.23
    title: Information security for use of cloud services
    description: Define ownership, secure configuration and monitoring requirements for cloud services used to process or store client data.
    tags: [cloud, configuration]
    level: base
    severity: high
    mapped_controls: [ENS-OP-EXP, RGPD-ART32]
    evidence_requirements:
      - github.repository_settings
      - manual.cloud_security_standard
    evaluator_key: cloud_security_governance
  - id: ISO-A.5.24
    title: Information security incident management planning and preparation
    description: Prepare incident response roles, severity model, runbooks, communications and escalation paths before an event occurs.
    tags: [incident_response, readiness]
    level: base
    severity: high
    mapped_controls: [ENS-OP-INC, RGPD-ART33]
    evidence_requirements:
      - manual.incident_response_plan
      - manual.on_call_roster
    evaluator_key: incident_response_preparedness
  - id: ISO-A.5.25
    title: Assessment and decision on information security events
    description: Triage security events consistently, assign severity and escalate incidents using approved decision criteria.
    tags: [incident_response, monitoring]
    level: base
    severity: high
    mapped_controls: [ENS-OP-INC, RGPD-ART33]
    evidence_requirements:
      - manual.incident_triage_procedure
      - manual.incident_tickets
    evaluator_key: incident_event_assessment
  - id: ISO-A.5.26
    title: Response to information security incidents
    description: Coordinate containment, eradication, recovery and stakeholder communication with evidence preservation throughout the response.
    tags: [incident_response, operations]
    level: base
    severity: high
    mapped_controls: [ENS-OP-INC, RGPD-ART33]
    evidence_requirements:
      - manual.incident_response_records
      - manual.post_incident_reviews
    evaluator_key: incident_response_execution
  - id: ISO-A.5.30
    title: ICT readiness for business continuity
    description: Define continuity objectives, recovery priorities and tested restoration plans for critical ICT services.
    tags: [continuity, resilience]
    level: advanced
    severity: high
    mapped_controls: [ENS-OP-BCP, RGPD-ART32]
    evidence_requirements:
      - manual.business_continuity_plan
      - manual.restore_test_results
    evaluator_key: ict_continuity
  - id: ISO-A.5.31
    title: Legal, statutory, regulatory and contractual requirements
    description: Maintain an obligations register covering ISO, ENS, privacy, contracts and reporting commitments relevant to the service.
    tags: [compliance, legal]
    level: base
    severity: high
    mapped_controls: [ENS-MARCO, RGPD-ART30]
    evidence_requirements:
      - manual.compliance_obligations_register
      - manual.legal_review_records
    evaluator_key: legal_requirements_register
  - id: ISO-A.5.32
    title: Intellectual property rights
    description: Protect software, templates, reports and client materials with defined ownership, usage rights and license tracking.
    tags: [legal, ip]
    level: base
    severity: medium
    mapped_controls: [ENS-MARCO, RGPD-ART28]
    evidence_requirements:
      - manual.ip_policy
      - manual.license_inventory
    evaluator_key: intellectual_property_controls
  - id: ISO-A.5.34
    title: Privacy and protection of PII
    description: Operate privacy controls for personal data processing, minimization, retention, third parties and data subject rights.
    tags: [privacy, pii]
    level: base
    severity: high
    mapped_controls: [ENS-MP.INFO, RGPD-ART5]
    evidence_requirements:
      - manual.privacy_notice
      - manual.record_of_processing_activities
    evaluator_key: privacy_operations
  - id: ISO-A.6.3
    title: Information security awareness, education and training
    description: Provide recurring security awareness and role-specific training, and track completion and exceptions.
    tags: [awareness, training]
    level: base
    severity: medium
    mapped_controls: [ENS-RRHH, RGPD-ART39]
    evidence_requirements:
      - manual.training_plan
      - manual.training_completion_records
    evaluator_key: security_awareness_program
  - id: ISO-A.6.4
    title: Disciplinary process
    description: Define disciplinary consequences for security policy violations and link them to HR and investigation processes.
    tags: [hr, governance]
    level: base
    severity: medium
    mapped_controls: [ENS-RRHH, RGPD-ART32]
    evidence_requirements:
      - manual.disciplinary_policy
      - manual.hr_procedure
    evaluator_key: disciplinary_process
  - id: ISO-A.6.5
    title: Responsibilities after termination or change of employment
    description: Remove or adjust logical and physical access promptly when people leave or change roles.
    tags: [hr, access]
    level: base
    severity: high
    mapped_controls: [ENS-RRHH, RGPD-ART32]
    evidence_requirements:
      - manual.offboarding_checklist
      - google.users_groups
    evaluator_key: offboarding_controls
  - id: ISO-A.8.8
    title: Management of technical vulnerabilities
    description: Identify, prioritize and remediate vulnerabilities based on exposure, exploitability and service criticality.
    tags: [vulnerability_management, remediation]
    level: base
    severity: high
    mapped_controls: [ENS-OP-MON, RGPD-ART32]
    evidence_requirements:
      - github.repository_settings
      - manual.vulnerability_management_procedure
    evaluator_key: vulnerability_management
  - id: ISO-A.8.9
    title: Configuration management
    description: Baseline secure configurations, review exceptions and track drift for infrastructure, endpoints and application services.
    tags: [configuration, hardening]
    level: base
    severity: high
    mapped_controls: [ENS-OP-EXP, RGPD-ART32]
    evidence_requirements:
      - github.repository_settings
      - manual.configuration_baselines
    evaluator_key: configuration_management
  - id: ISO-A.8.13
    title: Information backup
    description: Run backups at defined frequencies, protect backup media and test restore paths against recovery objectives.
    tags: [backup, resilience]
    level: base
    severity: high
    mapped_controls: [ENS-OP-BCP, RGPD-ART32]
    evidence_requirements:
      - manual.backup_policy
      - manual.restore_test_results
    evaluator_key: backup_and_restore
  - id: ISO-A.8.15
    title: Logging
    description: Collect security-relevant logs for auditability, incident response and privileged activity traceability.
    tags: [logging, traceability]
    level: base
    severity: high
    mapped_controls: [ENS-OP-MON, RGPD-ART30]
    evidence_requirements:
      - manual.logging_standard
      - manual.sample_security_logs
    evaluator_key: logging_controls
  - id: ISO-A.8.16
    title: Monitoring activities
    description: Monitor systems and connectors for anomalies, control failures and misuse, and route alerts to accountable responders.
    tags: [monitoring, detection]
    level: base
    severity: high
    mapped_controls: [ENS-OP-MON, RGPD-ART32]
    evidence_requirements:
      - manual.monitoring_runbook
      - manual.alert_review_records
    evaluator_key: monitoring_activities
  - id: ISO-A.8.24
    title: Use of cryptography
    description: Define approved cryptographic controls for data in transit, stored evidence, keys and signed artifacts.
    tags: [cryptography, key_management]
    level: base
    severity: high
    mapped_controls: [ENS-MP.CR, RGPD-ART32]
    evidence_requirements:
      - manual.crypto_standard
      - manual.key_management_procedure
    evaluator_key: cryptography_governance
  - id: ISO-A.8.32
    title: Change management
    description: Control change planning, testing, approval and rollback for application code, infrastructure and evidence pipelines.
    tags: [change_management, operations]
    level: base
    severity: high
    mapped_controls: [ENS-OP-PLN, RGPD-ART32]
    evidence_requirements:
      - github.repository_settings
      - manual.change_records
    evaluator_key: change_management
  - id: ISO-A.8.33
    title: Test information
    description: Protect production-like test data, sanitize personal information and restrict access to non-production environments.
    tags: [testing, privacy]
    level: advanced
    severity: medium
    mapped_controls: [ENS-MP.INFO, RGPD-ART25]
    evidence_requirements:
      - manual.test_data_policy
      - manual.masking_examples
    evaluator_key: test_data_protection
  - id: ISO-A.8.34
    title: Protection of information systems during audit testing
    description: Safeguard client systems and data when performing audit evidence collection, penetration work or intrusive validation.
    tags: [audit, client_protection]
    level: advanced
    severity: high
    mapped_controls: [ENS-OP-MON, RGPD-ART28]
    evidence_requirements:
      - manual.audit_testing_method
      - manual.client_authorization_records
    evaluator_key: audit_testing_safeguards
