apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "audity.fullname" . }}-worker
  labels:
    {{- include "audity.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "audity.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "audity.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command: ["uv", "run", "python", "-m", "worker_service.main"]
          envFrom:
            - configMapRef:
                name: {{ include "audity.fullname" . }}-config
            {{- if .Values.imageCredentials.secretName }}
            - secretRef:
                name: {{ .Values.imageCredentials.secretName }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
