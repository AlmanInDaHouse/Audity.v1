apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "audity.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "audity.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "audity.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["uv", "run", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: {{ include "audity.fullname" . }}-config
            {{- if .Values.imageCredentials.secretName }}
            - secretRef:
                name: {{ .Values.imageCredentials.secretName }}
            {{- end }}
