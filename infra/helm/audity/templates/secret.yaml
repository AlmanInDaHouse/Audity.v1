{{- if .Values.imageCredentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imageCredentials.secretName }}
  labels:
    {{- include "audity.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.imageCredentials.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
